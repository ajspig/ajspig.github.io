---
layout: default
---
<article>
  <header class="article-header">
    <h1 class="article-title">{{ page.title }}</h1>
    <time class="article-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>
  <div class="article-body">
    <div class="prose">
      {{ content }}
    </div>
    <aside class="toc" aria-labelledby="toc-title" hidden>
      <p class="toc-title" id="toc-title">On this page</p>
      <ol class="toc-list"></ol>
    </aside>
  </div>
</article>

<script>
  // Build the "On this page" sidebar from the post's own h2/h3 headings
  // and highlight the section currently being read.
  (function () {
    var toc = document.querySelector('.toc');
    var list = toc && toc.querySelector('.toc-list');
    var heads = Array.prototype.slice.call(document.querySelectorAll('.prose h2[id], .prose h3[id]'));
    if (!list || heads.length < 2) return;

    var links = heads.map(function (h) {
      var li = document.createElement('li');
      li.className = 'toc-' + h.tagName.toLowerCase();
      var a = document.createElement('a');
      a.href = '#' + encodeURIComponent(h.id);
      a.textContent = h.textContent;
      li.appendChild(a);
      list.appendChild(li);
      return a;
    });
    toc.hidden = false;

    var ticking = false;
    function update() {
      ticking = false;
      var active = 0;
      for (var i = 0; i < heads.length; i++) {
        if (heads[i].getBoundingClientRect().top <= 120) active = i; else break;
      }
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 2) active = heads.length - 1;
      links.forEach(function (a, i) { a.classList.toggle('is-active', i === active); });
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
    }, { passive: true });
    update();
  })();
</script>
