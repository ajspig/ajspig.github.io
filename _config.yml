# Site configuration

title: Abigail Spigarelli
description: >-
  A personal website for Abigail Spigarelli
lang: en
timezone:

url: "https://ajspig.github.io"
baseurl: ""

author:
  name: Abigail Spigarelli

github:
  username: ajspig

social:
  name: Abigail Spigarelli
  links:
    - https://github.com/ajspig
    - https://www.linkedin.com/in/abigail-spigarelli/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

collections:
  tabs:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      # Keep existing post URLs stable.
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json
